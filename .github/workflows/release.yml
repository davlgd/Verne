name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04         # Linux x86_64
          - ubuntu-24.04-arm     # Linux ARM64
          - macos-26             # macOS ARM64 (Tahoe)

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-v

      - name: Build verne & checksums
        run: scripts/release.sh

      - name: Set OS/ARCH variables
        run: |
          echo "OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}
          echo "ARCH=$(uname -m | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/verne-${{ env.OS_NAME }}-${{ env.ARCH }}
            bin/verne-${{ env.OS_NAME }}-${{ env.ARCH }}.sha256
            bin/verne-${{ env.OS_NAME }}-${{ env.ARCH }}.sha512
