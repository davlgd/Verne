name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest        # Linux x86_64 (Ubuntu 24.04)
          - ubuntu-24.04-arm     # Linux ARM64  (no -latest label; 26.04-arm is preview)
          - macos-latest         # macOS ARM64  (macOS 26)

    steps:
      - uses: actions/checkout@v7
      - uses: vlang/setup-v@v1.7

      - name: Build verne & checksums
        run: scripts/release.sh

      - name: Set OS/ARCH variables
        run: |
          echo "OS_NAME=$(uname -s | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}
          echo "ARCH=$(uname -m | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/verne-${{ env.OS_NAME }}-${{ env.ARCH }}
            bin/verne-${{ env.OS_NAME }}-${{ env.ARCH }}.sha256
            bin/verne-${{ env.OS_NAME }}-${{ env.ARCH }}.sha512
