name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest        # Linux x86_64 (Ubuntu 24.04)
          - ubuntu-24.04-arm     # Linux ARM64  (no -latest label; 26.04-arm is preview)
          - macos-latest         # macOS ARM64  (macOS 26)

    steps:
      - uses: actions/checkout@v7
      - uses: vlang/setup-v@v1.7

      - name: Verify formatting
        run: v fmt -verify .

      - name: Vet
        run: v vet src/

      - name: Test
        run: v test src/
