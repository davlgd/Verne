<header class="site-header" role="banner">
  <div class="container row">
    <a class="brand" href="/" rel="home">{{ site.title }}</a>

      <a href="/"{% if page.is_home %} aria-current="page"{% endif %}>Home</a>

    </nav>
  </div>
</header>
