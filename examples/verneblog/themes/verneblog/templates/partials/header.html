<header class="vbg-header">
  <a href="/" class="vbg-brand" aria-label="{{ site.title }}, home">
    <span class="vbg-brand-mark" aria-hidden="true"></span>
    <span class="vbg-brand-text" translate="no">{{ site.title }}</span>
  </a>
  <nav class="vbg-nav" aria-label="Primary">
    {%- for c in site.summary -%}
    <a href="{{ c.url }}" class="vbg-nav-link{% if c.url == page.relpermalink %} is-active{% endif %}"{% if c.url == page.relpermalink %} aria-current="page"{% endif %}>{{ c.title }}</a>
    {%- endfor %}
    <button type="button" class="vbg-icon-btn vbg-search-trigger kbar-trigger" aria-label="Search posts" data-toggle="search">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6" cy="6" r="4.25"/><path d="M9 9l3.5 3.5" stroke-linecap="round"/></svg>
    </button>
    <button type="button" class="vbg-icon-btn" aria-label="Toggle theme" aria-pressed="false" data-toggle="theme">
      <svg class="vbg-icon-sun" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
        <circle cx="7" cy="7" r="2.6"/>
        <path d="M7 1v1.4M7 11.6V13M1 7h1.4M11.6 7H13M2.5 2.5l1 1M10.5 10.5l1 1M2.5 11.5l1-1M10.5 3.5l1-1"/>
      </svg>
      <svg class="vbg-icon-moon" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
        <path d="M11.5 8.5a4.5 4.5 0 0 1-6-6 5 5 0 1 0 6 6z"/>
      </svg>
    </button>
  </nav>
</header>
