<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
<title>{% if not page.is_home %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<link rel="canonical" href="{{ page.permalink }}">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<meta name="generator" content="{{ site.generator }}">
<meta name="description" content="{{ page.meta_description }}">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:type" content="{{ page.og_type }}">
<meta property="og:locale" content="{{ site.language }}">
<meta property="og:description" content="{{ page.meta_description }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta name="twitter:card" content="summary_large_image">

<script>
  (function () {
    var stored = null;
    try { stored = localStorage.getItem('verne:theme'); } catch (e) {}
    var resolved = (stored === 'light' || stored === 'dark')
      ? stored
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = resolved;
  })();
</script>
<style>
  html[data-theme="dark"]  .vd-icon-sun  { display: none; }
  html[data-theme="dark"]  .vd-icon-moon { display: block; }
  html[data-theme="light"] .vd-icon-sun  { display: block; }
  html[data-theme="light"] .vd-icon-moon { display: none; }
</style>

<link rel="preload" href="/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin="anonymous">
<link rel="stylesheet" href="{{ assets.css_url }}" integrity="{{ assets.css_integrity }}" crossorigin="anonymous">
<script type="module" src="{{ assets.js_url }}" integrity="{{ assets.js_integrity }}" crossorigin="anonymous"></script>
